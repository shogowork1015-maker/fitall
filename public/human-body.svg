<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#f8f9fa"/>

  <!-- Human figure with realistic proportions -->
  <g transform="translate(200, 300)">
    <!-- Head -->
    <ellipse cx="0" cy="-120" rx="28" ry="32" fill="#fdbcb4" stroke="#e8a598" stroke-width="1"/>

    <!-- Hair -->
    <path d="M -28 -140 Q -25 -155 0 -160 Q 25 -155 28 -140 Q 20 -145 0 -148 Q -20 -145 -28 -140" fill="#3a3a3a"/>

    <!-- Eyes -->
    <circle cx="-8" cy="-120" r="2" fill="#333"/>
    <circle cx="8" cy="-120" r="2" fill="#333"/>

    <!-- Mouth -->
    <path d="M -5 -105 Q 0 -102 5 -105" fill="none" stroke="#d4a373" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="-14" y="-95" width="28" height="25" fill="#fdbcb4" stroke="#e8a598" stroke-width="1"/>

    <!-- Shoulders -->
    <ellipse cx="-40" cy="-75" rx="22" ry="14" fill="#fdbcb4" stroke="#e8a598" stroke-width="1" transform="rotate(-15 -40 -75)"/>
    <ellipse cx="40" cy="-75" rx="22" ry="14" fill="#fdbcb4" stroke="#e8a598" stroke-width="1" transform="rotate(15 40 -75)"/>

    <!-- Chest -->
    <path d="M -35 -60 Q -20 -40 0 -35 Q 20 -40 35 -60 L 30 -20 Q 0 -10 -30 -20 Z" fill="#fdbcb4" stroke="#e8a598" stroke-width="1"/>

    <!-- Abs -->
    <rect x="-22" y="-15" width="44" height="48" rx="8" fill="#fdbcb4" stroke="#e8a598" stroke-width="1"/>

    <!-- Abs definition lines -->
    <line x1="0" y1="-15" x2="0" y2="33" stroke="#e8a598" stroke-width="0.5" opacity="0.5"/>
    <line x1="-11" y1="-10" x2="-11" y2="28" stroke="#e8a598" stroke-width="0.5" opacity="0.5"/>
    <line x1="11" y1="-10" x2="11" y2="28" stroke="#e8a598" stroke-width="0.5" opacity="0.5"/>

    <!-- Arms -->
    <!-- Left arm -->
    <ellipse cx="-45" cy="-20" rx="14" ry="28" fill="#fdbcb4" stroke="#e8a598" stroke-width="1" transform="rotate(10 -45 -20)"/>
    <rect x="-52" y="12" width="18" height="42" rx="9" fill="#fdbcb4" stroke="#e8a598" stroke-width="1" transform="rotate(5 -43 33)"/>

    <!-- Right arm -->
    <ellipse cx="45" cy="-20" rx="14" ry="28" fill="#fdbcb4" stroke="#e8a598" stroke-width="1" transform="rotate(-10 45 -20)"/>
    <rect x="34" y="12" width="18" height="42" rx="9" fill="#fdbcb4" stroke="#e8a598" stroke-width="1" transform="rotate(-5 43 33)"/>

    <!-- Hands -->
    <circle cx="-48" cy="58" r="10" fill="#fdbcb4" stroke="#e8a598" stroke-width="1"/>
    <circle cx="48" cy="58" r="10" fill="#fdbcb4" stroke="#e8a598" stroke-width="1"/>

    <!-- Pelvis -->
    <path d="M -25 35 Q 0 45 25 35 L 20 65 Q 0 75 -20 65 Z" fill="#fdbcb4" stroke="#e8a598" stroke-width="1"/>

    <!-- Legs -->
    <!-- Left leg -->
    <path d="M -18 65 Q -15 90 -12 120 L -10 170 Q -7 175 0 175 Q 7 175 10 170 L 12 120 Q 15 90 18 65 Z"
          fill="#fdbcb4" stroke="#e8a598" stroke-width="1"/>

    <!-- Right leg -->
    <path d="M -8 65 Q -5 90 -2 120 L 0 170 Q 3 175 10 175 Q 17 175 20 170 L 18 120 Q 15 90 12 65 Z"
          fill="#fdbcb4" stroke="#e8a598" stroke-width="1"/>

    <!-- Feet -->
    <ellipse cx="-8" cy="190" rx="14" ry="10" fill="#fdbcb4" stroke="#e8a598" stroke-width="1"/>
    <ellipse cx="8" cy="190" rx="14" ry="10" fill="#fdbcb4" stroke="#e8a598" stroke-width="1"/>

    <!-- Muscle group highlights (subtle) -->
    <!-- Chest highlight -->
    <path d="M -30 -55 Q -15 -38 0 -33 Q 15 -38 30 -55 L 28 -25 Q 0 -15 -28 -25 Z"
          fill="#ff8c42" opacity="0.1"/>

    <!-- Abs highlight -->
    <rect x="-20" y="-12" width="40" height="42" rx="6" fill="#ffd93d" opacity="0.1"/>

    <!-- Shoulder highlights -->
    <ellipse cx="-40" cy="-75" rx="18" ry="10" fill="#ff8c42" opacity="0.1" transform="rotate(-15 -40 -75)"/>
    <ellipse cx="40" cy="-75" rx="18" ry="10" fill="#ff8c42" opacity="0.1" transform="rotate(15 40 -75)"/>

    <!-- Leg highlights -->
    <path d="M -16 70 Q -13 95 -10 125 L -8 165 Q -5 170 0 170 Q 5 170 8 165 L 10 125 Q 13 95 16 70 Z"
          fill="#9b59b6" opacity="0.1"/>
  </g>

  <!-- Subtle shadow -->
  <ellipse cx="200" cy="580" rx="60" ry="15" fill="#000" opacity="0.1"/>
</svg>
